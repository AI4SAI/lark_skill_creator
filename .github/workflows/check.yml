name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install .
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz
          printf '38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  %s\n' "$RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP" pandoc-3.13/bin/pandoc
          echo "$RUNNER_TEMP/pandoc-3.13/bin" >> "$GITHUB_PATH"
      - name: Verify conversion, packaging and migration
        run: |
          pandoc --version
          python -m unittest discover -s tests -v
          python skill_package.py check skills/sai-user-guide
          python skill_package.py pack skills/sai-user-guide --output dist
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sai-user-guide
          path: |
            dist/sai-user-guide-*.zip
            dist/sai-user-guide-*.zip.sha256
          if-no-files-found: error
