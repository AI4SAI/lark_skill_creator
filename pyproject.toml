[project]
name = "sai-skill-creator"
version = "0.1.0"
description = "SAI Docs → Skill 生成器：解析飞书Markdown文档，调用AIGC自动生成SKILL.md"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sai-skill-gen = "generate_skills:main"

[dependency-groups]
dev = []
